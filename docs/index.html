<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostKey</title>
  <meta name="description" content="GhostKey browser extension support and privacy information.">
  <meta http-equiv="refresh" content="0; url=./privacy-policy.html">
  <link rel="canonical" href="./privacy-policy.html">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08111f;
      --text: #edf6ff;
      --accent: #00d4ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #08111f;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(640px, calc(100% - 32px));
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2.5rem;
      letter-spacing: 0;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.18em;
    }
  </style>
</head>
<body>
  <main>
    <h1>GhostKey</h1>
    <p>Opening the <a href="./privacy-policy.html">GhostKey Privacy Policy</a>.</p>
  </main>
</body>
</html>
