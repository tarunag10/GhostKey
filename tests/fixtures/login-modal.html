<div id="login-modal" role="dialog" aria-modal="true" style="position: fixed; z-index: 9999; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;">
  <div style="background: white; padding: 32px; border-radius: 8px; width: 400px;">
    <h2>Sign in to continue</h2>

    <input type="email" name="email" placeholder="Email">

    <button>Continue with Google</button>
  </div>
</div>
