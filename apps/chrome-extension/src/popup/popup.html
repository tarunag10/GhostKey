<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; background: #1a1a2e; color: #e0e0e0; }
    h1 { font-size: 18px; margin-bottom: 12px; color: #00d4ff; }
    .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 8px; background: #16213e; border-radius: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    .status-dot.active { background: #00ff88; }
    .status-dot.inactive { background: #ff4444; }
    .site-name { font-size: 14px; flex: 1; }
    .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-bottom: 8px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-toggle { background: #00d4ff; color: #1a1a2e; }
    .btn-toggle.disabled { background: #444; color: #aaa; }
    .btn-clean { background: #44f0a4; color: #1a1a2e; }
    .btn-undo { background: #ff8800; color: #1a1a2e; }
    .debug-info { font-size: 11px; color: #666; margin-top: 8px; display: none; }
    .debug-info.visible { display: block; }
    .stats { font-size: 12px; color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>👻 GhostKey</h1>
  <div class="status">
    <div id="statusDot" class="status-dot active"></div>
    <span id="siteName" class="site-name">Loading...</span>
  </div>
  <button id="toggleBtn" class="btn btn-toggle">Disable on this site</button>
  <button id="cleanBtn" class="btn btn-clean">Clean this page</button>
  <button id="undoBtn" class="btn btn-undo">Undo last suppression</button>
  <div class="stats" id="stats"></div>
  <div class="debug-info" id="debugInfo"></div>
  <div style="text-align: center; font-size: 11px; color: #666; margin-top: 12px;">Created by Tarun Agarwal</div>
  <script src="popup.js"></script>
</body>
</html>
